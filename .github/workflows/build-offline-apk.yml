name: Build Offline VS Code APK

on:
  workflow_dispatch:
    inputs:
      vscode_ref:
        description: 'VS Code ref (branch, tag, or commit)'
        required: false
        default: '1.135.0'
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  VSCODE_REF: ${{ github.event.inputs.vscode_ref || '1.135.0' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout APK project
        uses: actions/checkout@v4

      - name: Checkout official VS Code source
        uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: ${{ env.VSCODE_REF }}
          path: vscode-src/vscode-main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: vscode-src/vscode-main/.nvmrc
          cache: npm
          cache-dependency-path: vscode-src/vscode-main/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install VS Code dependencies
        working-directory: vscode-src/vscode-main
        run: npm ci --no-audit --no-fund

      - name: Build VS Code Web distribution
        working-directory: vscode-src/vscode-main
        run: npm run gulp vscode-web

      - name: Copy VS Code Web into Android assets
        run: |
          rm -rf mobile/app/src/main/assets/vscode-web
          mkdir -p mobile/app/src/main/assets/vscode-web
          cp -R vscode-src/vscode-web/. mobile/app/src/main/assets/vscode-web/
          test -f mobile/app/src/main/assets/vscode-web/index.html

      - name: Build Android debug APK
        working-directory: mobile
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vscode-apk-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
