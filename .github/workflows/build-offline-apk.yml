name: Build Standalone VS Code APK

on:
  workflow_dispatch:
    inputs:
      vscode_ref:
        description: 'VS Code ref (branch, tag, or commit)'
        required: false
        default: '1.135.0'
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  VSCODE_REF: ${{ github.event.inputs.vscode_ref || '1.135.0' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout APK project
        uses: actions/checkout@v4

      - name: Checkout official VS Code source
        uses: actions/checkout@v4
        with:
          repository: microsoft/vscode
          ref: ${{ env.VSCODE_REF }}
          path: vscode-src/vscode-main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: vscode-src/vscode-main/.nvmrc
          cache: npm
          cache-dependency-path: vscode-src/vscode-main/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install VS Code dependencies
        working-directory: vscode-src/vscode-main
        run: npm ci --no-audit --no-fund

      - name: Compile VS Code Web workbench
        working-directory: vscode-src/vscode-main
        run: npm run compile-web

      - name: Compile built-in extensions for Web
        working-directory: vscode-src/vscode-main
        run: npm run compile-extensions-build

      - name: Validate required Web files
        working-directory: vscode-src/vscode-main
        run: |
          test -f out/nls.messages.js
          test -f out/vs/workbench/workbench.web.main.internal.js
          test -f out/vs/workbench/workbench.web.main.internal.css

      - name: Package the complete compiled Web tree into APK assets
        run: |
          rm -rf mobile/app/src/main/assets/vscode
          mkdir -p mobile/app/src/main/assets/vscode/out
          cp -R vscode-src/vscode-main/out/. mobile/app/src/main/assets/vscode/out/
          if [ -d vscode-src/vscode-main/extensions ]; then
            mkdir -p mobile/app/src/main/assets/vscode/extensions
            cp -R vscode-src/vscode-main/extensions/. mobile/app/src/main/assets/vscode/extensions/
          fi

      - name: Build standalone Android debug APK
        working-directory: mobile
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        run: |
          test -s mobile/app/build/outputs/apk/debug/app-debug.apk
          ls -lh mobile/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: vscode-apk-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
