name: Build Standalone VS Code APK (fixed)

on:
  workflow_dispatch:
    inputs:
      source_zip_url:
        description: 'Direct URL to the exact VS Code 1.135.0 source ZIP'
        required: false
        default: 'https://github.com/bezawitbiruk01-gif/Vscode-apk/releases/download/v1.135.0-source/vscode-main.zip'
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: vscode-apk-build
  cancel-in-progress: false

env:
  NODE_VERSION: '22.14.0'
  DEFAULT_SOURCE_ZIP_URL: 'https://github.com/bezawitbiruk01-gif/Vscode-apk/releases/download/v1.135.0-source/vscode-main.zip'
  EXPECTED_SOURCE_SHA256: '59738cb82daa723a088d53148e98b4620ecfe43dbc78c007ce79ce0641243c69'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout APK project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download exact VS Code 1.135.0 source ZIP
        env:
          SOURCE_ZIP_URL: ${{ inputs.source_zip_url || env.DEFAULT_SOURCE_ZIP_URL }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vscode-src
          mkdir -p vscode-src/imported
          curl -fL --retry 4 --retry-all-errors "$SOURCE_ZIP_URL" -o vscode-src/vscode-main-source.zip
          test -s vscode-src/vscode-main-source.zip
          echo "${EXPECTED_SOURCE_SHA256}  vscode-src/vscode-main-source.zip" | sha256sum -c -
          unzip -q vscode-src/vscode-main-source.zip -d vscode-src/imported

          ROOTS="$(find vscode-src/imported -mindepth 1 -maxdepth 1 -type d -print)"
          ROOT_COUNT="$(printf '%s\n' "$ROOTS" | sed '/^$/d' | wc -l | tr -d ' ')"
          TOP_FILE_COUNT="$(find vscode-src/imported -mindepth 1 -maxdepth 1 -type f -print | wc -l | tr -d ' ')"
          test "$ROOT_COUNT" = '1'
          test "$TOP_FILE_COUNT" = '0'

          ROOT="$(printf '%s\n' "$ROOTS" | head -n 1)"
          mv "$ROOT" vscode-src/vscode-main
          test -f vscode-src/vscode-main/package.json
          VERSION="$(node -p "require('./vscode-src/vscode-main/package.json').version")"
          echo "Supplied source version: $VERSION"
          test "$VERSION" = '1.135.0'

      - name: Verify source archive integrity
        shell: bash
        run: |
          set -euo pipefail
          sha256sum vscode-src/vscode-main-source.zip | tee vscode-src/vscode-main-source.zip.sha256
          SOURCE_COUNT="$(cd vscode-src/vscode-main && find . -type f | wc -l | tr -d ' ')"
          ARCHIVE_COUNT="$(unzip -Z1 vscode-src/vscode-main-source.zip | awk '!/\/$/' | wc -l | tr -d ' ')"
          printf 'source_files=%s\narchive_files=%s\n' "$SOURCE_COUNT" "$ARCHIVE_COUNT" | tee vscode-src/vscode-main-source.file-count
          test "$SOURCE_COUNT" = "$ARCHIVE_COUNT"

      - name: Setup Node.js dependency cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: vscode-src/vscode-main/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install VS Code dependencies
        working-directory: vscode-src/vscode-main
        run: npm ci --no-audit --no-fund

      - name: Build VS Code Web distribution
        working-directory: vscode-src/vscode-main
        run: npm run gulp vscode-web

      - name: Validate compiled Web distribution
        run: |
          set -euo pipefail
          test -f vscode-src/vscode-main/vscode-web/out/vs/workbench/workbench.web.main.internal.js
          test -f vscode-src/vscode-main/vscode-web/out/vs/workbench/workbench.web.main.internal.css
          test -f vscode-src/vscode-main/vscode-web/out/nls.messages.js
          test -f vscode-src/vscode-main/vscode-web/package.json

      - name: Package Web app and preserve complete source archive
        run: |
          set -euo pipefail
          rm -rf mobile/app/src/main/assets
          mkdir -p mobile/app/src/main/assets
          cp -R vscode-src/vscode-main/vscode-web/. mobile/app/src/main/assets/

          mkdir -p mobile/app/src/main/assets/source
          cp vscode-src/vscode-main-source.zip mobile/app/src/main/assets/source/
          cp vscode-src/vscode-main-source.zip.sha256 mobile/app/src/main/assets/source/
          cp vscode-src/vscode-main-source.file-count mobile/app/src/main/assets/source/

          test -f mobile/app/src/main/assets/index.html
          test -f mobile/app/src/main/assets/source/vscode-main-source.zip

          echo '--- APK asset size report ---'
          du -sh mobile/app/src/main/assets
          du -sh mobile/app/src/main/assets/source/vscode-main-source.zip

      - name: Build standalone Android APK
        working-directory: mobile
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='mobile/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: vscode-apk-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
