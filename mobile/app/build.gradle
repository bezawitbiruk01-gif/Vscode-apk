plugins {
    id 'com.android.application'
}

android {
    namespace 'com.biruk.vscodeapk'
    compileSdk 35

    defaultConfig {
        applicationId 'com.biruk.vscodeapk'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

